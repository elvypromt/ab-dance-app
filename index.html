<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>AB Dance Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: витрина студии и шахматка зала на одном «стеклянном» экране, роль переключается сверху, разделы в доке снизу. Аренда — светящаяся лента дня, которую тянут пальцем. Палитра Dopa Studio Lab, одна светлая тема. */
:root{
  color-scheme:light;
  --bg:#E9D7DA;--ink:#2E1B28;--body:#4A3343;--muted:#7D6373;
  --rose:#B86F82;--rose-deep:#94505F;--rose-soft:#F3E2E6;
  --lilac:#9C86D9;--lilac-soft:#ECE5FA;--peri:#8E9BDB;--sage:#6E9580;--peach:#D9906F;
  --free:#30A567;--warn:#C0563F;--busy:rgba(74,51,67,.13);
  --line:rgba(120,70,100,.14);
  --glass-fill:linear-gradient(140deg,rgba(255,255,255,.58),rgba(255,255,255,.24) 46%,rgba(255,255,255,.36));
  --glass-blur:blur(26px) saturate(185%);
  --glass-in:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 0 0 22px rgba(255,255,255,.18);
  --glass-out:0 12px 32px rgba(96,44,74,.10),0 2px 6px rgba(96,44,74,.06);
  --r-xl:30px;--r-lg:22px;--r-md:16px;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--body);font:500 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--rose-deep);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--ink);margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--rose-deep)}

.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:52vmax;height:52vmax;left:-14vmax;top:-18vmax;background:#D6A1B0}
.aurora i:nth-child(2){width:46vmax;height:46vmax;right:-12vmax;top:-10vmax;background:#B9A5E6;animation-duration:31s}
.aurora i:nth-child(3){width:40vmax;height:40vmax;left:28vw;top:38vh;background:#EBC2B7;opacity:.55;animation-duration:36s}
.aurora i:nth-child(4){width:44vmax;height:44vmax;right:-8vmax;bottom:-20vmax;background:#A9B2EA;opacity:.55;animation-duration:29s}
.aurora i:nth-child(5){width:38vmax;height:38vmax;left:-10vmax;bottom:-16vmax;background:#C995C8;opacity:.6;animation-duration:33s}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.08)}}

.glass{position:relative;background:var(--glass-fill);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-in),var(--glass-out);border-radius:var(--r-xl);border:1px solid rgba(255,255,255,.7)}
.lens{position:relative;background:radial-gradient(140% 120% at 30% 0%,rgba(255,255,255,.62),rgba(255,255,255,.18) 46%,rgba(255,255,255,.06) 72%),rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(6px) saturate(200%);backdrop-filter:blur(6px) saturate(200%);
  box-shadow:inset 0 0 0 .6px rgba(255,255,255,.75),inset 1.4px 1.8px .4px -.6px rgba(255,255,255,.98),inset 0 -10px 16px -12px rgba(255,255,255,.95),0 10px 24px -14px rgba(96,44,74,.42);
  transition:transform .5s var(--spring),background .3s,color .3s}
.lens:not(:disabled):hover{transform:translateY(-1px) scale(1.03)}
.lens:not(:disabled):active{transform:scale(1.07);transition-duration:.15s}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding-block:14px}
.bar{display:flex;align-items:center;gap:10px 12px;padding:10px 12px 10px 20px;border-radius:999px;flex-wrap:wrap}
.logo{font-family:var(--serif);font-size:27px;color:var(--ink);line-height:1;white-space:nowrap}
.logo em{color:var(--rose-deep)}
.proto{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar .sp{margin-left:auto}
.seg{display:flex;padding:3px;border-radius:999px;gap:2px}
.seg button{padding:8px 15px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:rgba(46,27,40,.72);color:#fff}
.mgr{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;font-weight:800;font-size:13px;color:var(--ink)}
.mgr svg{width:17px;height:17px}

.dock{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;display:flex;gap:2px;padding:6px;border-radius:999px;max-width:calc(100vw - 20px)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 13px;border-radius:999px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;position:relative}
.dock button svg{width:21px;height:21px}
.dock button.on{color:var(--rose-deep);background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.6));box-shadow:inset 0 1px 0 #fff,0 4px 14px rgba(100,50,80,.16)}
.dock .badge{position:absolute;top:3px;right:7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--rose-deep);color:#fff;font-size:10px;line-height:17px}

main{display:grid;gap:22px;padding-block:8px 24px}
.hero{padding:30px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:end;overflow:hidden}
.hero h1{font-size:clamp(40px,6.4vw,78px);line-height:.95}
.hero h1 em{color:var(--rose-deep);display:block}
.hero p{margin:0;max-width:52ch}
.hero .l{display:grid;gap:14px}
.ticket{padding:20px;border-radius:var(--r-lg);display:grid;gap:12px;background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
.ticket .big{display:flex;align-items:baseline;gap:10px}
.ticket .big .d{font-family:var(--serif);font-size:64px;line-height:.85;color:var(--ink)}
.ticket .big .m{font-weight:800;color:var(--muted);font-size:13px;line-height:1.25}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:24px 20px}}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--body)}
.chip.on{background:rgba(46,27,40,.68);color:#fff}
.btn{padding:12px 20px;border-radius:999px;font-weight:800;font-size:14px;color:var(--ink)}
.btn.pri{background:radial-gradient(140% 120% at 30% 0%,rgba(255,255,255,.5),rgba(255,255,255,.08) 50%,rgba(255,255,255,0) 72%),rgba(176,98,122,.85);color:#fff}
.btn.dark{background:radial-gradient(140% 120% at 30% 0%,rgba(255,255,255,.3),rgba(255,255,255,0) 60%),rgba(46,27,40,.82);color:#fff}
.btn.ghost{color:var(--warn)}
.btn:disabled{opacity:.45}
.sect{display:grid;gap:14px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sect-h h2{font-size:clamp(30px,3.8vw,42px)}
.note{font-size:13px;color:var(--muted)}
.todo{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--rose-deep);background:var(--rose-soft);padding:2px 7px;border-radius:6px;vertical-align:middle}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{padding:20px;border-radius:var(--r-lg);display:grid;gap:10px;align-content:start;min-width:0}
.card h3{font-size:27px;line-height:1.05}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--body)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.meta{display:grid;gap:4px;font-size:13.5px}
.meta b{color:var(--ink);font-weight:700}
.price{font-family:var(--serif);font-size:30px;color:var(--ink);line-height:1}
.price small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:600}
.seats{height:7px;border-radius:9px;background:rgba(120,70,100,.12);overflow:hidden}
.seats i{display:block;height:100%;background:var(--c);border-radius:9px}
.starts{display:flex;align-items:baseline;gap:8px}
.starts .d{font-family:var(--serif);font-size:46px;line-height:.9;color:var(--ink)}
.starts .m{font-size:13px;font-weight:700;color:var(--muted);line-height:1.2}

.days{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px}
.day{flex:none;width:64px;padding:10px 0;border-radius:18px;text-align:center;display:grid;gap:1px}
.day .w{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.day .n{font-family:var(--serif);font-size:26px;color:var(--ink);line-height:1}
.day .c{font-size:11px;font-weight:700;color:var(--free)}
.day .c.z{color:var(--muted)}
.day.on{background:rgba(46,27,40,.72)}
.day.on .w,.day.on .n,.day.on .c{color:#fff}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{min-width:84px;padding:10px 14px;border-radius:14px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--free);background:rgba(48,165,103,.1);box-shadow:inset 0 0 0 1px rgba(48,165,103,.3);transition:transform .4s var(--spring);display:grid;line-height:1.2}
.slot small{font-size:10.5px;font-weight:700;letter-spacing:.04em;opacity:.8}
.slot:not(:disabled):hover{transform:scale(1.05);background:rgba(48,165,103,.18)}
.slot:disabled{color:var(--muted);background:repeating-linear-gradient(135deg,var(--busy) 0 6px,rgba(74,51,67,.06) 6px 12px);box-shadow:none}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.panel{padding:22px;border-radius:var(--r-xl);display:grid;gap:16px;min-width:0}
.who-card{display:flex;gap:14px;align-items:center}
.ava{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--serif);font-size:24px;color:#fff;background:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}

/* аренда: лента дня */
.rent{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:18px;align-items:start}
@media (max-width:860px){.rent{grid-template-columns:1fr}}
.ribbon-wrap{display:grid;gap:10px}
.ribbon{position:relative;display:flex;height:104px;border-radius:26px;padding:6px;gap:3px;touch-action:none;user-select:none;-webkit-user-select:none;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.22));box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),inset 0 -14px 24px -18px rgba(150,80,110,.35),0 18px 40px -22px rgba(96,44,74,.5)}
.hr{flex:1;min-width:0;border-radius:12px;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:10.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;
  background:rgba(48,165,103,.08);box-shadow:inset 0 0 0 1px rgba(48,165,103,.18);transition:background .25s,box-shadow .25s,color .25s,transform .45s var(--spring)}
.hr::before{content:"";position:absolute;top:10px;left:50%;width:2px;height:18px;border-radius:2px;background:rgba(48,165,103,.35);transform:translateX(-50%)}
.hr.busy{background:repeating-linear-gradient(135deg,var(--busy) 0 6px,rgba(74,51,67,.05) 6px 12px);box-shadow:none;color:rgba(125,99,115,.7);cursor:not-allowed}
.hr.busy::before{background:transparent}
.hr.sel{color:#fff;background:linear-gradient(180deg,#C98397,#A9748F 60%,#9C86D9);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 22px -10px rgba(148,80,95,.8);transform:translateY(-3px)}
.hr.sel::before{background:rgba(255,255,255,.7)}
.hr.sel.first::after,.hr.sel.last::after{content:"";position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(60,20,40,.4);transform:translateY(-70%)}
.hr.sel.first::after{left:-4px}.hr.sel.last::after{right:-4px}
@media (max-width:560px){.ribbon{height:92px;gap:2px;padding:5px}.hr{font-size:0}.hr:nth-child(odd){font-size:9.5px}}
.ribbon-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted)}
.ribbon-legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:18px;height:12px;border-radius:4px;display:inline-block}
.sum{padding:22px;border-radius:var(--r-xl);display:grid;gap:14px}
.sum .range{font-family:var(--serif);font-size:clamp(40px,5vw,54px);color:var(--ink);line-height:.95;font-variant-numeric:tabular-nums}
.sum .range span{color:var(--rose-deep)}
.sum .sub{font-weight:700;color:var(--muted);font-size:13.5px}
.lines{display:grid;gap:6px;font-size:14px}
.lines div{display:flex;justify-content:space-between;gap:10px}
.lines b{color:var(--ink);font-variant-numeric:tabular-nums}
.lines .tot{border-top:1px solid var(--line);padding-top:8px;font-size:16px}
.lines .tot b{font-family:var(--serif);font-size:30px;font-weight:400}
.purpose{display:grid;gap:8px}
.purpose button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;font-weight:700;text-align:left}
.purpose button small{font-weight:800;color:var(--muted);white-space:nowrap}
.purpose button.on{background:rgba(46,27,40,.74);color:#fff}
.purpose button.on small{color:rgba(255,255,255,.8)}

table.prices{width:100%;border-collapse:collapse;font-size:14.5px}
.prices th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:0 10px 8px 0}
.prices td{padding:12px 10px 12px 0;border-top:1px solid var(--line);vertical-align:top}
.prices td.r{text-align:right;font-weight:800;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.prices .grp td{font-family:var(--serif);font-size:24px;color:var(--ink);padding-top:22px;border-top:0}
.scroll{overflow-x:auto}

/* менеджер */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{padding:16px 18px;border-radius:var(--r-lg);display:grid;gap:2px}
.stat .v{font-family:var(--serif);font-size:40px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;font-weight:700;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.gridbox{overflow-x:auto;border-radius:var(--r-lg);padding:14px;background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.sched{display:grid;grid-template-columns:44px repeat(7,minmax(96px,1fr));grid-template-rows:40px repeat(26,22px);min-width:740px;position:relative}
.sched .hd{grid-row:1;text-align:center;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);padding-top:2px}
.sched .hd b{display:block;font-family:var(--serif);font-size:20px;letter-spacing:0;color:var(--ink);font-weight:400;line-height:1}
.sched .hd.today b{color:var(--rose-deep)}
.sched .tm{grid-column:1;font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;transform:translateY(-7px)}
.sched .cell{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.sched .cell.half{border-top-style:dashed;border-top-color:rgba(120,70,100,.07)}
.sched button.cell:hover{background:rgba(48,165,103,.12)}
.sched .avail{background:rgba(48,165,103,.09)}
.ev{margin:1px 3px;border-radius:10px;padding:4px 7px;font-size:11.5px;line-height:1.25;color:#fff;text-align:left;overflow:hidden;z-index:2;background:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 10px -4px rgba(60,20,40,.4);transition:transform .35s var(--spring)}
.ev:hover{transform:scale(1.03)}
.ev b{display:block;font-weight:800}
.ev span{opacity:.9}
.ev.rent-ev{background:repeating-linear-gradient(135deg,var(--rose-deep) 0 8px,#A55E6E 8px 16px)}
.ev.hold{background:rgba(255,255,255,.55);color:var(--rose-deep);box-shadow:inset 0 0 0 1.5px var(--rose);border:0}

.req{padding:16px 18px;border-radius:var(--r-lg);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.req .who{font-weight:800;color:var(--ink)}
.req .what{font-size:13.5px}
.req .when{font-size:12px;color:var(--muted);font-weight:700}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:800}
.pill.check{background:var(--rose-soft);color:var(--rose-deep)}
.pill.pay{background:rgba(217,144,111,.18);color:#A5603F}
.pill.wait{background:var(--lilac-soft);color:#6C55AE}
.pill.ok{background:rgba(48,165,103,.14);color:var(--free)}
.pill.no{background:rgba(120,70,100,.1);color:var(--muted)}
@media (max-width:560px){.req{grid-template-columns:1fr}}

/* окно */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(60,30,50,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;left:50%;top:50%;width:min(500px,calc(100vw - 32px));max-height:calc(100dvh - 48px);overflow:auto;transform:translate(-50%,-46%) scale(.95);opacity:0;pointer-events:none;transition:transform .5s var(--spring),opacity .25s;padding:24px;display:grid;gap:14px}
.sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.sheet h2{font-size:32px;padding-right:44px;line-height:1.05}
.sheet .x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;font-size:20px;display:grid;place-items:center;z-index:2}
.steps{display:flex;gap:6px}
.steps i{height:4px;flex:1;border-radius:4px;background:rgba(120,70,100,.15)}
.steps i.on{background:var(--rose)}
.fld{display:grid;gap:5px}
.fld label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.55);color:var(--ink);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--warn);font-weight:700;font-size:13.5px;min-height:1em}
.qr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.qr canvas{width:156px;height:156px;border-radius:18px;background:#fff;padding:10px;box-shadow:0 12px 28px -14px rgba(60,20,40,.5)}
@media (max-width:440px){.qr{grid-template-columns:1fr;justify-items:center;text-align:center}}
.amount{font-family:var(--serif);font-size:48px;line-height:1;color:var(--ink)}
.timer{font-weight:800;color:var(--rose-deep);font-variant-numeric:tabular-nums}
.copy{display:flex;gap:8px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.55);font-weight:800;color:var(--ink);user-select:all}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);opacity:0;z-index:80;padding:12px 20px;border-radius:999px;background:rgba(46,27,40,.88);color:#fff;font-weight:700;font-size:14px;transition:all .45s var(--spring);pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}

.tl{display:flex;gap:14px;overflow-x:auto;padding:30px 4px 12px;scroll-snap-type:x proximity}
.tl-i{position:relative;flex:none;width:214px;scroll-snap-align:start;padding:16px 16px 14px;border-radius:var(--r-lg);display:grid;gap:7px;text-align:left;align-content:start;transition:transform .45s var(--spring)}
.tl-i:hover{transform:translateY(-3px)}
.tl-i::after{content:"";position:absolute;top:-17px;left:0;right:-14px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--c),rgba(156,134,217,.35))}

  {id:'hh2',dir:'heels',t:'heels',title:'High Heels, поток 17 ноября',age:'взрослые',date:'2026-11-17',days:'ВТ и ЧТ, 19:30–21:00',len:'2 недели, 4 занятия',price:880,seats:12,taken:2,real:true},

const NOW=new Date(2026,9,20),MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const plural=(n,a,b,c)=>n%10===1&&n%100!==11?a:[2,3,4].includes(n%10)&&![12,13,14].includes(n%100)?b:c;
function fill(c){const dt=new Date(c.date+'T00:00');c.dt=dt;c.start=String(dt.getDate());c.month=MON[dt.getMonth()];c.wd=(dt.getDay()+6)%7;c.weeks=c.weeks||parseInt(c.len)||2;return c}

const daysTo=c=>Math.round((c.dt-NOW)/864e5);
// курс идёт, если старт был не раньше, чем его длина в неделях
const running=c=>daysTo(c)<=0&&-daysTo(c)<c.weeks*7;
const upcoming=()=>COURSES.filter(c=>daysTo(c)>0||running(c)).sort((a,b)=>a.dt-b.dt);
const nextOpen=()=>upcoming().find(c=>daysTo(c)>0&&c.seats>c.taken&&!c.pre);
function whenTxt(c){const n=daysTo(c);if(running(c))return n===0?'идёт · сегодня первое занятие':'идёт сейчас';
  return n===1?'завтра':'через '+n+' '+plural(n,'день','дня','дней')}

];
let requests=[
  {id:1,who:'Анна Белова',contact:'@anna_bel',what:'Индивидуальное, High Heels',d:2,s:'15:00',dur:60,t:'heels',dir:'indiv',sum:1500,ago:'12 минут назад',st:'check'},
  {id:2,who:'Ирина',contact:'@irina_photo',what:'Аренда зала, фото или видео',d:6,s:'15:00',dur:180,dir:'rent',sum:1620,ago:'40 минут назад',st:'pay'},
  {id:3,who:'Вика',contact:'+7 916 •• •• 42',what:'Лист ожидания: High Heels, текущий поток',ago:'час назад',st:'wait'},
  {id:4,who:'Даша К.',contact:'@dashak',what:'Курс High Heels с 3 ноября',sum:2200,ago:'вчера',st:'ok'}
];

/* ---------- помощники ---------- */
const $=id=>document.getElementById(id);
const m=s=>{const[h,mm]=s.split(':').map(Number);return h*60+mm};
const hm=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ฿';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hrs=n=>n+' '+(n%10===1&&n%100!==11?'час':[2,3,4].includes(n%10)&&![12,13,14].includes(n%100)?'часа':'часов');
const label=e=>e.title||(e.dir==='indiv'?'Индив · '+e.who:e.who);
const overlap=(a1,a2,b1,b2)=>a1<b2&&b1<a2;
// бронь, которая ждёт оплаты или проверки, держит время так же, как занятие
const holds=()=>requests.filter(r=>r.d!=null&&(r.st==='pay'||r.st==='check')).map(r=>({id:'h'+r.id,d:r.d,s:r.s,dur:r.dur||60,t:r.t,dir:r.dir,who:r.who,hold:true}));
function conflicts(c,skipId){
  const s=m(c.s),f=s+c.dur,out=[],all=events.concat(holds());
  for(const e of all){if(e.id===skipId||e.d!==c.d)continue;if(overlap(s,f,m(e.s),m(e.s)+e.dur)){out.push(`зал занят: ${e.hold?'бронь ждёт оплаты':label(e)}, ${e.s}–${hm(m(e.s)+e.dur)}`);break}}
  if(c.t&&!out.length)for(const e of all){if(e.id===skipId||e.d!==c.d||e.t!==c.t)continue;

  return out}

  $('rqForm').onsubmit=e=>{e.preventDefault();const n=$('rqName').value.trim(),c=$('rqContact').value.trim();
    if(!n||!c){$('rqErr').textContent='Заполните имя и контакт, чтобы менеджер мог ответить.';return}
    if(o.wait){requests.unshift({id:Date.now(),who:n,contact:c,what:o.what,ago:'только что',st:'wait'});closeSheet();renderDock();toast(o.msg||'Вы в листе ожидания. Бот напишет, когда освободится место');return}
    if(o.d!=null&&conflicts({d:o.d,s:o.s,dur:o.dur,t:o.t}).length){$('rqErr').textContent='Это время только что заняли. Выберите другое.';return}
    const sum=Math.round(o.total*PREPAY[o.kind]);
    const r={id:Date.now(),who:n,contact:c,what:o.what,d:o.d,s:o.s,dur:o.dur,t:o.t,dir:o.dir,sum,course:o.course&&o.course.id,ago:'только что',st:'pay'};
    requests.unshift(r);renderDock();if(tab==='rent'){st.ra=st.rb=null;render()}else if(tab==='slots')render();

function payStep(o,r){
  openSheet(`<div class="steps"><i class="on"></i><i class="on"></i><i></i></div><span class="eyebrow">Шаг 2 из 3 · предоплата</span><h2>Оплатите по QR</h2>

    <span class="todo" style="justify-self:start">здесь будет QR студии</span></div></div>
  <div class="copy" style="font-weight:600;user-select:text">Время держится за вами <span class="timer" id="tmr" style="margin-left:auto">30:00</span></div>

  drawQR($('qrc'),r.id);

    openSheet(`<div class="steps"><i class="on"></i><i class="on"></i><i class="on"></i></div><span class="eyebrow">Шаг 3 из 3 · готово</span><h2>Спасибо, ${esc(r.who)}!</h2>
    <p style="margin:0">Менеджер проверит оплату и подтвердит запись в боте. За день до занятия придёт напоминание.</p>
    <div class="lines"><div><span>${esc(r.what)}</span><b>${r.s?WD[r.d]+' '+WEEK[r.d]+' окт, '+r.s:''}</b></div><div><span>Предоплата</span><b>${rub(r.sum)}</b></div></div>
    <button class="btn pri lens" id="doneBtn">Хорошо</button>`);$('doneBtn').onclick=closeSheet}}
// декоративный QR-узор для прототипа, настоящий код даст банк студии
function drawQR(cv,seed){const g=cv.getContext('2d'),N=25,s=cv.width/N;let x=seed%2147483647||7;const rnd=()=>(x=x*16807%2147483647)/2147483647;
  g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.fillStyle='#2E1B28';
  const fin=(cx,cy)=>{g.fillRect(cx*s,cy*s,7*s,7*s);g.fillStyle='#fff';g.fillRect((cx+1)*s,(cy+1)*s,5*s,5*s);g.fillStyle='#2E1B28';g.fillRect((cx+2)*s,(cy+2)*s,3*s,3*s)};
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const inF=(i<8&&j<8)||(i>N-9&&j<8)||(i<8&&j>N-9);if(!inF&&rnd()>.52)g.fillRect(i*s,j*s,s,s)}
  fin(0,0);fin(N-7,0);fin(0,N-7);g.fillStyle='#B86F82';g.beginPath();g.arc(cv.width/2,cv.height/2,s*2.2,0,7);g.fill()}

  </tbody></table></div>
  <div class="panel glass"><div class="lines"><div><span>Предоплата: курсы</span><b>100%</b></div><div><span>Предоплата: индивы</span><b>50%</b></div><div><span>Предоплата: аренда</span><b>30%</b></div></div>
  <span class="note">Оплата по QR через PromptPay. Если не оплатить за 30 минут, время освобождается.</span></div></section>`}

/* ---------- админка ---------- */
function load(){let busy=0;for(const e of events)busy+=e.dur;const total=7*13*60;return{busy,total,pct:Math.round(busy/total*100)}}
function grid(opts={}){
  const start=540;let h=`<div class="sched"><div></div>`;
  WEEK.forEach((n,d)=>h+=`<div class="hd ${d===TODAY?'today':''}" style="grid-column:${d+2}">${WD[d]}<b>${n}</b></div>`);
  for(let r=0;r<26;r++){const t=start+r*30;if(r%2===0)h+=`<div class="tm" style="grid-row:${r+2}">${hm(t)}</div>`;
    for(let d=0;d<7;d++){let av='';if(opts.trainer){const a=TRAINERS[opts.trainer].avail[d]||[];if(a.some(([x,y])=>t>=x*60&&t<y*60))av=' avail'}
      h+=`<button class="cell${r%2?' half':''}${av}" style="grid-column:${d+2};grid-row:${r+2}" data-d="${d}" data-t="${hm(t)}" aria-label="${WD[d]} ${hm(t)}"></button>`}}
  for(const e of events.concat(holds())){if(opts.trainer&&e.t!==opts.trainer)continue;const r=(m(e.s)-start)/30,d=DIRS[e.dir];
    h+=`<button class="ev ${e.hold?'hold':e.dir==='rent'?'rent-ev':''}" style="--c:${d.c};grid-column:${e.d+2};grid-row:${r+2}/span ${e.dur/30}" ${e.hold?`data-hold="${e.id.slice(1)}"`:`data-ev="${e.id}"`}><b>${e.hold?'Бронь · '+esc(e.who):esc(label(e))}</b><span>${e.s}–${hm(m(e.s)+e.dur)}${e.hold?' · ждёт оплату':e.t?' · '+TRAINERS[e.t].short:''}</span></button>`}
  return h+'</div>'}
const legend=()=>`<div class="legend">${Object.values(DIRS).map(d=>`<span style="--c:${d.c}"><i class="dot"></i>${d.name}</span>`).join('')}<span><i class="dot" style="background:#fff;box-shadow:inset 0 0 0 1.5px var(--rose)"></i>Бронь ждёт оплату</span></div>`;

function vHall(){
  const L=load(),n=requests.filter(r=>['check','pay'].includes(r.st)).length;let fr=0;for(let h=9;h<22;h++)if(!hallBusy(TODAY,h))fr++;
  return `<section class="stats">
    <div class="stat glass"><span class="v">${L.pct}%</span><span class="l">загрузка зала на неделю</span></div>
    <div class="stat glass"><span class="v">${Math.round((L.total-L.busy)/60)} ч</span><span class="l">свободно до воскресенья</span></div>
    <div class="stat glass"><span class="v">${fr} ч</span><span class="l">свободно сегодня, вторник</span></div>
    <div class="stat glass"><span class="v">${n}</span><span class="l">брони ждут оплату или проверку</span></div>
  </section>
  <section class="sect"><div class="sect-h"><h2>Потоки курсов</h2><button class="btn lens" id="newCourse">Новый поток</button></div>
    ${timeline(upcoming(),'data-mc')}
    <span class="note">Нажмите на поток, чтобы увидеть записанных и отправить анонс. Новый поток сразу появится у клиенток в «Ближайших стартах».</span>
  </section>
  <section class="sect"><div class="sect-h"><h2>Зал · 19–25 октября</h2><button class="btn pri lens" id="addBtn">Добавить занятие</button></div>
    ${legend()}<div class="gridbox">${grid()}</div>
    <span class="note">Нажмите на пустую клетку, чтобы поставить занятие, или на занятие, чтобы перенести его. Пересечения по залу и тренеру система не пропустит. Клиентки видят здесь только «свободно» и «занято».</span>
  </section>`}
bind.hall=()=>{$('addBtn').onclick=()=>editForm({d:TODAY,s:'14:00',dur:60,dir:'indiv',t:'heels'});bindGrid();
  $('newCourse').onclick=courseForm;document.querySelectorAll('[data-mc]').forEach(b=>b.onclick=()=>courseSheet(COURSES.find(c=>c.id===b.dataset.mc)))};
function courseSheet(c){const d=DIRS[c.dir],left=c.seats-c.taken,wl=requests.filter(r=>r.st==='wait'&&r.what.includes(c.title)).length;
  openSheet(`<span class="tag" style="--c:${d.c}"><i class="dot"></i>${d.name.toUpperCase()}</span><h2>${esc(c.title)}</h2>
  <div class="lines"><div><span>Старт</span><b>${c.start} ${c.month}, ${DAY_FULL[c.wd]}</b></div><div><span>Когда</span><b>${whenTxt(c)}</b></div>
    <div><span>Расписание</span><b>${c.days}</b></div><div><span>Записано</span><b>${c.taken} из ${c.seats}</b></div>
    <div><span>Свободно</span><b>${Math.max(0,left)}</b></div><div><span>В листе ожидания</span><b>${wl}</b></div><div><span>Цена</span><b>${rub(c.price)}</b></div></div>
  <div class="row"><button class="btn pri lens" id="annBtn">Анонс в бот</button>${c.pre?'<button class="btn lens" id="openBtn">Открыть набор</button>':''}</div>
  <div class="err" id="annMsg" style="color:var(--body)"></div>`);
  $('annBtn').onclick=()=>{$('annMsg').textContent=`Черновик готов: «Новый поток ${d.name} стартует ${c.start} ${c.month}, ${c.days}. Осталось ${Math.max(0,left)} мест». Уйдёт подписчикам бота только после вашего «Отправить».`};
  if(c.pre)$('openBtn').onclick=()=>{c.pre=false;closeSheet();render();toast('Набор открыт, оплата доступна клиенткам')}}
function courseForm(){
  openSheet(`<span class="eyebrow">Новый поток</span><h2>Запланировать курс</h2>
  <form id="cForm" style="display:grid;gap:12px" novalidate>
    <div class="two"><div class="fld"><label for="cDir">Направление</label><select id="cDir">${['heels','aerial','kids','acro'].map(k=>`<option value="${k}">${DIRS[k].name}</option>`).join('')}</select></div>
      <div class="fld"><label for="cDate">Дата старта</label><input id="cDate" type="date" value="2026-12-15" min="2026-10-21"></div></div>
    <div class="fld"><label for="cDays">Дни и время</label><input id="cDays" value="ВТ и ЧТ, 19:30–21:00"></div>
    <div class="two"><div class="fld"><label for="cLen">Длительность</label><select id="cLen"><option value="2">2 недели, 4 занятия</option><option value="4">4 недели, 8 занятий</option></select></div>
      <div class="fld"><label for="cSeats">Мест</label><input id="cSeats" type="number" min="1" max="30" value="12"></div></div>
    <div class="fld"><label for="cPrice">Цена, ฿</label><input id="cPrice" type="number" min="0" step="10" value="880"></div>
    <div class="err" id="cErr"></div>
    <button class="btn pri lens" type="submit">Добавить поток</button>
  </form>`);
  $('cForm').onsubmit=e=>{e.preventDefault();const date=$('cDate').value,dir=$('cDir').value,w=+$('cLen').value;
    if(!date||new Date(date+'T00:00')<=NOW){$('cErr').textContent='Выберите дату после сегодняшней.';return}
    const c=fill({id:'c'+Date.now(),dir,t:dir==='kids'||dir==='acro'?'kids':dir,title:DIRS[dir].name+', поток '+new Date(date+'T00:00').getDate()+' '+MON[new Date(date+'T00:00').getMonth()],
      age:dir==='kids'||dir==='acro'?'дети':'взрослые',date,days:$('cDays').value.trim()||'уточнить',len:w===2?'2 недели, 4 занятия':'4 недели, 8 занятий',weeks:w,price:+$('cPrice').value||0,seats:+$('cSeats').value||12,taken:0});
    COURSES.push(c);closeSheet();render();toast('Поток добавлен, клиентки уже видят его в стартах')}}
function bindGrid(){
  document.querySelectorAll('.sched .cell').forEach(c=>c.onclick=()=>editForm({d:+c.dataset.d,s:c.dataset.t,dur:60,dir:'indiv',t:tab==='people'?st.mTrainer:'heels'}));
  document.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>evSheet(events.find(e=>e.id==b.dataset.ev)));
  document.querySelectorAll('[data-hold]').forEach(b=>b.onclick=()=>go('inbox'))}
function evSheet(e){
  const d=DIRS[e.dir];
  openSheet(`<span class="tag" style="--c:${d.c}"><i class="dot"></i>${d.name.toUpperCase()}</span><h2>${esc(label(e))}</h2>
  <div class="meta"><span><b>${DAY_FULL[e.d]}, ${WEEK[e.d]} октября</b>, ${e.s}–${hm(m(e.s)+e.dur)}</span>${e.t?`<span>Ведёт: ${TRAINERS[e.t].name.toLowerCase()}</span>`:''}</div>
  <div class="row"><button class="btn pri lens" id="evMove">Перенести</button><button class="btn ghost lens" id="evDel">Отменить занятие</button></div>
  <div class="err" id="evMsg"></div>`);
  $('evMove').onclick=()=>editForm({...e});
  $('evDel').onclick=()=>{const b=$('evDel');if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Да, отменить';$('evMsg').textContent=e.dir==='rent'||e.dir==='indiv'?'Бот напишет клиенту об отмене.':'Бот напишет всем записанным.';return}
    events=events.filter(x=>x.id!==e.id);closeSheet();render();toast('Отменено, клиенты получат сообщение')}}
function editForm(e){
  const isNew=!e.id,opt=(obj,cur)=>Object.entries(obj).map(([k,v])=>`<option value="${k}" ${k===cur?'selected':''}>${v.name}</option>`).join('');
  const times=[];for(let t=540;t<1320;t+=30)times.push(hm(t));
  openSheet(`<span class="eyebrow">${isNew?'Новое занятие':'Перенос'}</span><h2>${isNew?'Поставить в зал':esc(label(e))}</h2>
  <form id="evForm" style="display:grid;gap:12px" novalidate>
    <div class="two"><div class="fld"><label for="fDir">Что</label><select id="fDir">${opt(DIRS,e.dir)}</select></div>
      <div class="fld"><label for="fT">Тренер</label><select id="fT"><option value="">без тренера</option>${opt(TRAINERS,e.t)}</select></div></div>
    <div class="fld"><label for="fTitle">Название или клиент</label><input id="fTitle" value="${esc(e.title||e.who||'')}" placeholder="Например, Анна Белова"></div>
    <div class="two"><div class="fld"><label for="fD">День</label><select id="fD">${WEEK.map((n,d)=>`<option value="${d}" ${d===e.d?'selected':''}>${WD[d]}, ${n} окт</option>`).join('')}</select></div>
      <div class="fld"><label for="fS">Начало</label><select id="fS">${times.map(t=>`<option ${t===e.s?'selected':''}>${t}</option>`).join('')}</select></div></div>
    <div class="fld"><label for="fDur">Длительность</label><select id="fDur">${[30,60,90,120,180,240].map(x=>`<option value="${x}" ${x===e.dur?'selected':''}>${x<60?x+' минут':x/60+' ч'}</option>`).join('')}</select></div>
    <div class="err" id="fErr" aria-live="polite"></div>
    <button class="btn pri lens" type="submit">${isNew?'Поставить':'Сохранить'}</button>
  </form>`);
  const read=()=>({d:+$('fD').value,s:$('fS').value,dur:+$('fDur').value,dir:$('fDir').value,t:$('fDir').value==='rent'?'':$('fT').value});
  const check=()=>{const cf=conflicts(read(),e.id);$('fErr').textContent=cf.length?'Нельзя: '+cf[0]+'.':'';return cf};
  ['fD','fS','fDur','fT','fDir'].forEach(id=>$(id).onchange=check);check();
  $('evForm').onsubmit=ev=>{ev.preventDefault();if(check().length)return;const c=read(),name=$('fTitle').value.trim(),rec={...c,t:c.t||undefined};
    if(c.dir==='indiv'||c.dir==='rent'){rec.who=name||'Клиент';rec.title=undefined}else rec.title=name||DIRS[c.dir].name;
    if(isNew)events.push({...rec,id:++uid});else Object.assign(events.find(x=>x.id===e.id),rec);
    closeSheet();render();toast(isNew?'Занятие в расписании':'Перенесено, клиенты получат сообщение')}}

function vPeople(){
  const k=st.mTrainer,t=TRAINERS[k],mine=events.filter(e=>e.t===k);
  const hours=mine.reduce((a,e)=>a+e.dur,0)/60,ind=mine.filter(e=>e.dir==='indiv').length;
  const free=WEEK.reduce((a,_,d)=>a+trainerHours(k,d).filter(x=>x.free).length,0);
  return `<section class="sect"><div class="sect-h"><h2>Тренеры</h2>
    <div class="row">${Object.entries(TRAINERS).map(([key,x])=>`<button id="mt_${key}" class="chip lens ${key===k?'on':''}" data-mt="${key}">${x.short}</button>`).join('')}</div></div>
  <div class="stats">
    <div class="stat glass" style="--c:${t.c}"><div class="who-card"><div class="ava">${t.ini}</div><div><div style="font-weight:800;color:var(--ink)">${t.name}</div><div style="font-size:13px">${t.role}</div></div></div></div>
    <div class="stat glass"><span class="v">${hours} ч</span><span class="l">ведёт на этой неделе</span></div>
    <div class="stat glass"><span class="v">${ind}</span><span class="l">индивидуальных</span></div>
    <div class="stat glass"><span class="v">${free}</span><span class="l">свободных окон для записи</span></div>
  </div>
  ${legend()}<div class="gridbox">${grid({trainer:k})}</div>
  <span class="note">Зелёным отмечены рабочие часы тренера для индивов. Их задают один раз, дальше неделя повторяется сама. Всё, что попало на занятия, аренду или бронь, у клиенток становится «занято».</span>
  </section>`}
bind.people=()=>{document.querySelectorAll('[data-mt]').forEach(b=>b.onclick=()=>{st.mTrainer=b.dataset.mt;render()});bindGrid()};

function vInbox(){
  const P={check:'чек на проверке',pay:'ждём оплату',wait:'лист ожидания',ok:'подтверждена',no:'отклонена'};
  return `<section class="sect"><div class="sect-h"><h2>Заявки</h2><span class="note">Дублируются менеджеру в бот</span></div>
  <div style="display:grid;gap:10px">${requests.map(r=>`<article class="req glass"><div style="min-width:0;display:grid;gap:3px">
      <div><span class="who">${esc(r.who)}</span> <span class="pill ${r.st}">${P[r.st]}</span></div>
      <div class="what">${esc(r.what)}${r.d!=null?` · <b>${WD[r.d]} ${WEEK[r.d]} окт, ${r.s}–${hm(m(r.s)+(r.dur||60))}</b>`:''}</div>
      <div class="when">${esc(r.contact)} · ${r.ago}${r.sum?' · предоплата '+rub(r.sum):''}${r.receipt?' · чек приложен':''}</div></div>
      <div class="row">${
        r.st==='check'?`<button class="btn pri lens" id="ok_${r.id}" data-ok="${r.id}">Оплата пришла</button><button class="btn lens" id="no_${r.id}" data-no="${r.id}">Не пришла</button>`:
        r.st==='pay'?`<button class="btn lens" id="rem_${r.id}" data-rem="${r.id}">Напомнить</button><button class="btn ghost lens" id="no_${r.id}" data-no="${r.id}">Снять бронь</button>`:
        r.st==='wait'?`<button class="btn pri lens" id="off_${r.id}" data-off="${r.id}">Предложить место</button>`:''}</div>
    </article>`).join('')}</div></section>`}
bind.inbox=()=>{
  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{const r=requests.find(x=>x.id==b.dataset.ok);
    if(r.d!=null)events.push({id:++uid,d:r.d,s:r.s,dur:r.dur||60,dir:r.dir,t:r.t,who:r.who});
    if(r.course){const c=COURSES.find(x=>x.id===r.course);if(c)c.taken++}
    r.st='ok';render();toast(r.d!=null?'Поставлено в зал, клиентке ушло подтверждение':'Место в курсе закреплено')});
  document.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>{requests.find(x=>x.id==b.dataset.no).st='no';render();toast('Бронь снята, время снова свободно')});
  document.querySelectorAll('[data-rem]').forEach(b=>b.onclick=()=>toast('Бот напомнил об оплате'));
  document.querySelectorAll('[data-off]').forEach(b=>b.onclick=()=>toast('Бот написал: освободилось место, берёте?'))};

try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
render();
</script>

</body>
</html>
