<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>AB Dance Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: витрина студии и шахматка зала на одном «стеклянном» экране, роль переключается сверху, разделы в доке снизу. Аренда — светящаяся лента дня, которую тянут пальцем. Палитра Dopa Studio Lab, одна светлая тема. */
:root{
  color-scheme:light;
  --bg:#E9D7DA;--ink:#2E1B28;--body:#4A3343;--muted:#7D6373;
  --rose:#B86F82;--rose-deep:#94505F;--rose-soft:#F3E2E6;
  --lilac:#9C86D9;--lilac-soft:#ECE5FA;--peri:#8E9BDB;--sage:#6E9580;--peach:#D9906F;
  --free:#30A567;--warn:#C0563F;--busy:rgba(74,51,67,.13);
  --line:rgba(120,70,100,.14);
  --glass-fill:linear-gradient(140deg,rgba(255,255,255,.58),rgba(255,255,255,.24) 46%,rgba(255,255,255,.36));
  --glass-blur:blur(26px) saturate(185%);
  --glass-in:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 0 0 22px rgba(255,255,255,.18);
  --glass-out:0 12px 32px rgba(96,44,74,.10),0 2px 6px rgba(96,44,74,.06);
  --r-xl:30px;--r-lg:22px;--r-md:16px;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--body);font:500 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--rose-deep);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--ink);margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--rose-deep)}

.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75;animation:drift 26s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:52vmax;height:52vmax;left:-14vmax;top:-18vmax;background:#D6A1B0}
.aurora i:nth-child(2){width:46vmax;height:46vmax;right:-12vmax;top:-10vmax;background:#B9A5E6;animation-duration:31s}
.aurora i:nth-child(3){width:40vmax;height:40vmax;left:28vw;top:38vh;background:#EBC2B7;opacity:.55;animation-duration:36s}
.aurora i:nth-child(4){width:44vmax;height:44vmax;right:-8vmax;bottom:-20vmax;background:#A9B2EA;opacity:.55;animation-duration:29s}
.aurora i:nth-child(5){width:38vmax;height:38vmax;left:-10vmax;bottom:-16vmax;background:#C995C8;opacity:.6;animation-duration:33s}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.08)}}

.glass{position:relative;background:var(--glass-fill);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-in),var(--glass-out);border-radius:var(--r-xl);border:1px solid rgba(255,255,255,.7)}
.lens{position:relative;background:radial-gradient(140% 120% at 30% 0%,rgba(255,255,255,.62),rgba(255,255,255,.18) 46%,rgba(255,255,255,.06) 72%),rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(6px) saturate(200%);backdrop-filter:blur(6px) saturate(200%);
  box-shadow:inset 0 0 0 .6px rgba(255,255,255,.75),inset 1.4px 1.8px .4px -.6px rgba(255,255,255,.98),inset 0 -10px 16px -12px rgba(255,255,255,.95),0 10px 24px -14px rgba(96,44,74,.42);
  transition:transform .5s var(--spring),background .3s,color .3s}
.lens:not(:disabled):hover{transform:translateY(-1px) scale(1.03)}
.lens:not(:disabled):active{transform:scale(1.07);transition-duration:.15s}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding-block:14px}
.bar{display:flex;align-items:center;gap:10px 12px;padding:10px 12px 10px 20px;border-radius:999px;flex-wrap:wrap}
.logo{font-family:var(--serif);font-size:27px;color:var(--ink);line-height:1;white-space:nowrap}
.logo em{color:var(--rose-deep)}
.proto{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar .sp{margin-left:auto}
.seg{display:flex;padding:3px;border-radius:999px;gap:2px}
.seg button{padding:8px 15px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.seg button.on{background:rgba(46,27,40,.72);color:#fff}
.mgr{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;font-weight:800;font-size:13px;color:var(--ink)}
.mgr svg{width:17px;height:17px}

.dock{overflow-x:auto;scrollbar-width:none;position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;display:flex;gap:2px;padding:6px;border-radius:999px;max-width:calc(100vw - 20px)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 13px;border-radius:999px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;position:relative}
.dock button svg{width:21px;height:21px}
.dock button.on{color:var(--rose-deep);background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.6));box-shadow:inset 0 1px 0 #fff,0 4px 14px rgba(100,50,80,.16)}
.dock .badge{position:absolute;top:3px;right:7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--rose-deep);color:#fff;font-size:10px;line-height:17px}

main{display:grid;gap:22px;padding-block:8px 24px}
.hero{padding:30px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:end;overflow:hidden}
.hero h1{font-size:clamp(40px,6.4vw,78px);line-height:.95}
.hero h1 em{color:var(--rose-deep);display:block}
.hero p{margin:0;max-width:52ch}
.hero .l{display:grid;gap:14px}
.ticket{padding:20px;border-radius:var(--r-lg);display:grid;gap:12px;background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
.ticket .big{display:flex;align-items:baseline;gap:10px}
.ticket .big .d{font-family:var(--serif);font-size:64px;line-height:.85;color:var(--ink)}
.ticket .big .m{font-weight:800;color:var(--muted);font-size:13px;line-height:1.25}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:24px 20px}}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--body)}
.chip.on{background:rgba(46,27,40,.68);color:#fff}
.btn{padding:12px 20px;border-radius:999px;font-weight:800;font-size:14px;color:var(--ink)}
.btn.pri{background:radial-gradient(140% 120% at 30% 0%,rgba(255,255,255,.5),rgba(255,255,255,.08) 50%,rgba(255,255,255,0) 72%),rgba(176,98,122,.85);color:#fff}
.btn.dark{background:radial-gradient(140% 120% at 30% 0%,rgba(255,255,255,.3),rgba(255,255,255,0) 60%),rgba(46,27,40,.82);color:#fff}
.btn.ghost{color:var(--warn)}
.btn:disabled{opacity:.45}
.sect{display:grid;gap:14px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sect-h h2{font-size:clamp(30px,3.8vw,42px)}
.note{font-size:13px;color:var(--muted)}
.todo{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--rose-deep);background:var(--rose-soft);padding:2px 7px;border-radius:6px;vertical-align:middle}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{padding:20px;border-radius:var(--r-lg);display:grid;gap:10px;align-content:start;min-width:0}
.card h3{font-size:27px;line-height:1.05}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;letter-spacing:.05em;color:var(--body)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c)}
.meta{display:grid;gap:4px;font-size:13.5px}
.meta b{color:var(--ink);font-weight:700}
.price{font-family:var(--serif);font-size:30px;color:var(--ink);line-height:1}
.price small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:600}
.seats{height:7px;border-radius:9px;background:rgba(120,70,100,.12);overflow:hidden}
.seats i{display:block;height:100%;background:var(--c);border-radius:9px}
.starts{display:flex;align-items:baseline;gap:8px}
.starts .d{font-family:var(--serif);font-size:46px;line-height:.9;color:var(--ink)}
.starts .m{font-size:13px;font-weight:700;color:var(--muted);line-height:1.2}

.days{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px}
.day{flex:none;width:64px;padding:10px 0;border-radius:18px;text-align:center;display:grid;gap:1px}
.day .w{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.day .n{font-family:var(--serif);font-size:26px;color:var(--ink);line-height:1}
.day .c{font-size:11px;font-weight:700;color:var(--free)}
.day .c.z{color:var(--muted)}
.day.on{background:rgba(46,27,40,.72)}
.day.on .w,.day.on .n,.day.on .c{color:#fff}
.slots{display:flex;flex-wrap:wrap;gap:8px}
.slot{min-width:84px;padding:10px 14px;border-radius:14px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--free);background:rgba(48,165,103,.1);box-shadow:inset 0 0 0 1px rgba(48,165,103,.3);transition:transform .4s var(--spring);display:grid;line-height:1.2}
.slot small{font-size:10.5px;font-weight:700;letter-spacing:.04em;opacity:.8}
.slot:not(:disabled):hover{transform:scale(1.05);background:rgba(48,165,103,.18)}
.slot:disabled{color:var(--muted);background:repeating-linear-gradient(135deg,var(--busy) 0 6px,rgba(74,51,67,.06) 6px 12px);box-shadow:none}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.panel{padding:22px;border-radius:var(--r-xl);display:grid;gap:16px;min-width:0}
.who-card{display:flex;gap:14px;align-items:center}
.ava{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--serif);font-size:24px;color:#fff;background:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}

/* аренда: лента дня */
.rent{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:18px;align-items:start}
@media (max-width:860px){.rent{grid-template-columns:1fr}}
.ribbon-wrap{display:grid;gap:10px}
.ribbon{position:relative;display:flex;height:104px;border-radius:26px;padding:6px;gap:3px;touch-action:none;user-select:none;-webkit-user-select:none;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.22));box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),inset 0 -14px 24px -18px rgba(150,80,110,.35),0 18px 40px -22px rgba(96,44,74,.5)}
.hr{flex:1;min-width:0;border-radius:12px;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:10.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;
  background:rgba(48,165,103,.08);box-shadow:inset 0 0 0 1px rgba(48,165,103,.18);transition:background .25s,box-shadow .25s,color .25s,transform .45s var(--spring)}
.hr::before{content:"";position:absolute;top:10px;left:50%;width:2px;height:18px;border-radius:2px;background:rgba(48,165,103,.35);transform:translateX(-50%)}
.hr.busy{background:repeating-linear-gradient(135deg,var(--busy) 0 6px,rgba(74,51,67,.05) 6px 12px);box-shadow:none;color:rgba(125,99,115,.7);cursor:not-allowed}
.hr.busy::before{background:transparent}
.hr.sel{color:#fff;background:linear-gradient(180deg,#C98397,#A9748F 60%,#9C86D9);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 22px -10px rgba(148,80,95,.8);transform:translateY(-3px)}
.hr.sel::before{background:rgba(255,255,255,.7)}
.hr.sel.first::after,.hr.sel.last::after{content:"";position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(60,20,40,.4);transform:translateY(-70%)}
.hr.sel.first::after{left:-4px}.hr.sel.last::after{right:-4px}
@media (max-width:560px){.ribbon{height:92px;gap:2px;padding:5px}.hr{font-size:0}.hr:nth-child(odd){font-size:9.5px}}
.ribbon-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted)}
.ribbon-legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:18px;height:12px;border-radius:4px;display:inline-block}
.sum{padding:22px;border-radius:var(--r-xl);display:grid;gap:14px}
.sum .range{font-family:var(--serif);font-size:clamp(40px,5vw,54px);color:var(--ink);line-height:.95;font-variant-numeric:tabular-nums}
.sum .range span{color:var(--rose-deep)}
.sum .sub{font-weight:700;color:var(--muted);font-size:13.5px}
.lines{display:grid;gap:6px;font-size:14px}
.lines div{display:flex;justify-content:space-between;gap:10px}
.lines b{color:var(--ink);font-variant-numeric:tabular-nums}
.lines .tot{border-top:1px solid var(--line);padding-top:8px;font-size:16px}
.lines .tot b{font-family:var(--serif);font-size:30px;font-weight:400}
.purpose{display:grid;gap:8px}
.purpose button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;font-weight:700;text-align:left}
.purpose button small{font-weight:800;color:var(--muted);white-space:nowrap}
.purpose button.on{background:rgba(46,27,40,.74);color:#fff}
.purpose button.on small{color:rgba(255,255,255,.8)}

table.prices{width:100%;border-collapse:collapse;font-size:14.5px}
.prices th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:0 10px 8px 0}
.prices td{padding:12px 10px 12px 0;border-top:1px solid var(--line);vertical-align:top}
.prices td.r{text-align:right;font-weight:800;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.prices .grp td{font-family:var(--serif);font-size:24px;color:var(--ink);padding-top:22px;border-top:0}
.scroll{overflow-x:auto}

/* менеджер */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{padding:16px 18px;border-radius:var(--r-lg);display:grid;gap:2px}
.stat .v{font-family:var(--serif);font-size:40px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;font-weight:700;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:6px}
.gridbox{overflow-x:auto;border-radius:var(--r-lg);padding:14px;background:rgba(255,255,255,.28);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.sched{display:grid;grid-template-columns:44px repeat(7,minmax(96px,1fr));grid-template-rows:40px repeat(26,22px);min-width:740px;position:relative}
.sched .hd{grid-row:1;text-align:center;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);padding-top:2px}
.sched .hd b{display:block;font-family:var(--serif);font-size:20px;letter-spacing:0;color:var(--ink);font-weight:400;line-height:1}
.sched .hd.today b{color:var(--rose-deep)}
.sched .tm{grid-column:1;font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;transform:translateY(-7px)}
.sched .cell{border-top:1px solid var(--line);border-left:1px solid var(--line)}
.sched .cell.half{border-top-style:dashed;border-top-color:rgba(120,70,100,.07)}
.sched button.cell:hover{background:rgba(48,165,103,.12)}
.sched .avail{background:rgba(48,165,103,.09)}
.ev{margin:1px 3px;border-radius:10px;padding:4px 7px;font-size:11.5px;line-height:1.25;color:#fff;text-align:left;overflow:hidden;z-index:2;background:var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 10px -4px rgba(60,20,40,.4);transition:transform .35s var(--spring)}
.ev:hover{transform:scale(1.03)}
.ev b{display:block;font-weight:800}
.ev span{opacity:.9}
.ev.rent-ev{background:repeating-linear-gradient(135deg,var(--rose-deep) 0 8px,#A55E6E 8px 16px)}
.ev.hold{background:rgba(255,255,255,.55);color:var(--rose-deep);box-shadow:inset 0 0 0 1.5px var(--rose);border:0}

.req{padding:16px 18px;border-radius:var(--r-lg);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center}
.req .who{font-weight:800;color:var(--ink)}
.req .what{font-size:13.5px}
.req .when{font-size:12px;color:var(--muted);font-weight:700}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:800}
.pill.check{background:var(--rose-soft);color:var(--rose-deep)}
.pill.pay{background:rgba(217,144,111,.18);color:#A5603F}
.pill.wait{background:var(--lilac-soft);color:#6C55AE}
.pill.ok{background:rgba(48,165,103,.14);color:var(--free)}
.pill.no{background:rgba(120,70,100,.1);color:var(--muted)}
@media (max-width:560px){.req{grid-template-columns:1fr}}

/* окно */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(60,30,50,.28);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;left:50%;top:50%;width:min(500px,calc(100vw - 32px));max-height:calc(100dvh - 48px);overflow:auto;transform:translate(-50%,-46%) scale(.95);opacity:0;pointer-events:none;transition:transform .5s var(--spring),opacity .25s;padding:24px;display:grid;gap:14px}
.sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto}
.sheet h2{font-size:32px;padding-right:44px;line-height:1.05}
.sheet .x{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;font-size:20px;display:grid;place-items:center;z-index:2}
.steps{display:flex;gap:6px}
.steps i{height:4px;flex:1;border-radius:4px;background:rgba(120,70,100,.15)}
.steps i.on{background:var(--rose)}
.fld{display:grid;gap:5px}
.fld label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{width:100%;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.55);color:var(--ink);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--warn);font-weight:700;font-size:13.5px;min-height:1em}
.qr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.qr canvas{width:156px;height:156px;border-radius:18px;background:#fff;padding:10px;box-shadow:0 12px 28px -14px rgba(60,20,40,.5)}
@media (max-width:440px){.qr{grid-template-columns:1fr;justify-items:center;text-align:center}}
.amount{font-family:var(--serif);font-size:48px;line-height:1;color:var(--ink)}
.timer{font-weight:800;color:var(--rose-deep);font-variant-numeric:tabular-nums}
.copy{display:flex;gap:8px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.55);font-weight:800;color:var(--ink);user-select:all}
.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);opacity:0;z-index:80;padding:12px 20px;border-radius:999px;background:rgba(46,27,40,.88);color:#fff;font-weight:700;font-size:14px;transition:all .45s var(--spring);pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{transform:translate(-50%,0);opacity:1}

const hm=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
const rub=n=>Math.round(n).toLocaleString('ru-RU')+' ฿';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hrs=n=>n+' '+(n%10===1&&n%100!==11?'час':[2,3,4].includes(n%10)&&![12,13,14].includes(n%100)?'часа':'часов');
const label=e=>e.title||(e.dir==='indiv'?'Индив · '+e.who:e.who);
const overlap=(a1,a2,b1,b2)=>a1<b2&&b1<a2;
// бронь, которая ждёт оплаты или проверки, держит время так же, как занятие
const holds=()=>requests.filter(r=>r.d!=null&&(r.st==='pay'||r.st==='check')).map(r=>({id:'h'+r.id,d:r.d,s:r.s,dur:r.dur||60,t:r.t,dir:r.dir,who:r.who,hold:true}));
function conflicts(c,skipId){
  const s=m(c.s),f=s+c.dur,out=[],all=events.concat(holds());
  for(const e of all){if(e.id===skipId||e.d!==c.d||e.away)continue;if(overlap(s,f,m(e.s),m(e.s)+e.dur)){out.push(`зал занят: ${e.hold?'бронь ждёт оплаты':label(e)}, ${e.s}–${hm(m(e.s)+e.dur)}`);break}}
  if(c.t&&!out.length)for(const e of all){if(e.id===skipId||e.d!==c.d||e.t!==c.t)continue;
    if(overlap(s,f,m(e.s),m(e.s)+e.dur)){out.push(`тренер в это время занят`);break}}
  if(s<540||f>1320)out.push('студия работает с 09:00 до 22:00');
  return out}
// все часы из рабочего окна тренера; занятые показываем серыми, без подробностей
function trainerHours(t,d){const res=[];for(const[a,b]of(TRAINERS[t].avail[d]||[]))for(let h=a;h<b;h++){const s=hm(h*60);res.push({s,free:!conflicts({d,s,dur:60,t}).length})}return res}
const hallBusy=(d,h)=>conflicts({d,s:hm(h*60),dur:60}).length>0;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(()=>el.classList.remove('on'),2800)}

function closeSheet(){clearInterval(tick);$('sheet').classList.remove('on');$('scrim').classList.remove('on')}
$('scrim').onclick=closeSheet;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

  addEventListener('pointermove',e=>{if(!drag)return;const h=hAt(e);if(h==null)return;const a=Math.min(anchor,h),b=Math.max(anchor,h)+1;if(clear(a,b)){st.ra=a;st.rb=b;paintRent()}});
  addEventListener('pointerup',()=>drag=false);
  // клавиатура: Enter на часе ставит начало, повторный Enter правее — конец
  rib.querySelectorAll('.hr').forEach(el=>el.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;e.preventDefault();const h=+el.dataset.h;if(hallBusy(st.rDay,h))return;
    if(st.ra!=null&&h>=st.ra&&clear(st.ra,h+1))st.rb=h+1;else{st.ra=h;st.rb=h+1}paintRent()}));
  paintRent()};

// декоративный QR-узор для прототипа, настоящий код даст банк студии
function drawQR(cv,seed){const g=cv.getContext('2d'),N=25,s=cv.width/N;let x=seed%2147483647||7;const rnd=()=>(x=x*16807%2147483647)/2147483647;
  g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);g.fillStyle='#2E1B28';
  const fin=(cx,cy)=>{g.fillRect(cx*s,cy*s,7*s,7*s);g.fillStyle='#fff';g.fillRect((cx+1)*s,(cy+1)*s,5*s,5*s);g.fillStyle='#2E1B28';g.fillRect((cx+2)*s,(cy+2)*s,3*s,3*s)};
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const inF=(i<8&&j<8)||(i>N-9&&j<8)||(i<8&&j>N-9);if(!inF&&rnd()>.52)g.fillRect(i*s,j*s,s,s)}
  fin(0,0);fin(N-7,0);fin(0,N-7);g.fillStyle='#B86F82';g.beginPath();g.arc(cv.width/2,cv.height/2,s*2.2,0,7);g.fill()}

/* шаблон услуги: всё кнопками, без лишнего */
function svcForm(s){const isNew=!s;
  const f=s?{...s,vars:(s.vars||[]).map(v=>({...v}))}:{cat:'Мастер-классы',name:'',sub:'',price:'',unit:'разово',pre:0,rem:1,vars:[]};
  const chips=(k,opts,dis)=>`<div class="row" role="group">${opts.map(([v,l])=>`<button type="button" class="chip lens ${String(f[k])===String(v)?'on':''}" data-fk="${k}" data-fv="${v}" ${dis?'disabled':''}>${l}</button>`).join('')}</div>`;
  const draw=()=>{const hasV=f.vars.length;openSheet(`<span class="eyebrow">${isNew?'Новая услуга':'Услуга'}</span><h2>${isNew?'Добавить услугу':esc(f.name)}</h2>
  <form id="sForm" class="tpl" novalidate>
    <div class="step"><span class="sn">1</span><b>Раздел</b>${chips('cat',CATS.map(c=>[c,c]),f.key)}</div>
    <div class="step"><span class="sn">2</span><b>Название</b><input id="sName" value="${esc(f.name)}" placeholder="Например, мастер-класс Strip"><input id="sSub" value="${esc(f.sub||'')}" placeholder="Коротко: когда, для кого (можно пусто)"></div>
    <div class="step"><span class="sn">3</span><b>Цена</b>${chips('unit',UNITS,f.key)}
      ${hasV?'':`<label class="pin big"><input id="sPrice" type="number" min="0" step="50" value="${f.price??''}" placeholder="не знаю"><span>฿</span></label>`}
      <div class="vars">${f.vars.map((v,i)=>`<div class="var"><input data-vn="${i}" value="${esc(v.n)}" placeholder="Вариант, например «4 занятия»"><label class="pin"><input data-vp="${i}" type="number" min="0" step="50" value="${v.price??''}" placeholder="?"><span>฿</span></label><button type="button" class="btn ghost lens sm" data-vx="${i}" aria-label="Убрать вариант">×</button></div>`).join('')}</div>
      <button type="button" class="btn lens sm" id="addVar" style="justify-self:start">+ ${hasV?'Ещё вариант':'Несколько вариантов цены'}</button>
      <span class="note">Цену можно оставить пустой, клиентки увидят «уточнить».</span></div>
    <div class="step"><span class="sn">4</span><b>Предоплата</b>${chips('pre',[[0,'Не нужна'],[30,'30%'],[50,'50%'],[100,'Вся сумма']])}
      <label class="ck"><input type="checkbox" id="sRem" ${f.rem?'checked':''}> Напоминать об оплате, если не заплатили</label></div>
    <div class="err" id="sErr"></div>
    <div class="row"><button class="btn pri lens" type="submit">${isNew?'Добавить':'Сохранить'}</button>${!isNew&&!s.key?'<button class="btn ghost lens" type="button" id="sDel">Убрать услугу</button>':''}</div>
  </form>`);
    const keep=()=>{f.name=$('sName').value;f.sub=$('sSub').value;if($('sPrice'))f.price=$('sPrice').value===''?null:+$('sPrice').value;f.rem=$('sRem').checked;
      document.querySelectorAll('[data-vn]').forEach(i=>f.vars[+i.dataset.vn].n=i.value);document.querySelectorAll('[data-vp]').forEach(i=>f.vars[+i.dataset.vp].price=i.value===''?null:+i.value)};
    document.querySelectorAll('[data-fk]').forEach(b=>b.onclick=()=>{keep();const v=b.dataset.fv;f[b.dataset.fk]=b.dataset.fk==='pre'?+v:v;draw()});
    $('addVar').onclick=()=>{keep();if(!f.vars.length)f.vars.push({n:'Основной',price:f.price});f.vars.push({n:'',price:null});draw()};
    document.querySelectorAll('[data-vx]').forEach(b=>b.onclick=()=>{keep();f.vars.splice(+b.dataset.vx,1);if(f.vars.length===1){f.price=f.vars[0].price;f.vars=[]}draw()});
    $('sForm').onsubmit=e=>{e.preventDefault();keep();const n=f.name.trim();if(!n){$('sErr').textContent='Напишите название.';return}
      const v={cat:f.cat,name:n,sub:f.sub.trim(),unit:f.unit,pre:f.pre,rem:f.rem,vars:f.vars.filter(x=>x.n.trim()),price:f.vars.length?(f.vars[0].price??null):f.price};
      if(isNew)SERVICES.push({id:'s'+Date.now(),...v});else Object.assign(s,v);applyPrices();closeSheet();render();toast(isNew?'Услуга добавлена, клиентки видят её в ценах':'Сохранено')};
    if($('sDel'))$('sDel').onclick=()=>{const b=$('sDel');if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Да, убрать';return}SERVICES=SERVICES.filter(x=>x!==s);closeSheet();render();toast('Услуга убрана')}};
  draw()}

  let free=0;WEEK.forEach((_,d)=>{for(let h=9;h<22;h++)if(!hallBusy(d,h))free++});
  let g='<div class="rcal"><div></div>';
  for(let h=9;h<22;h++)g+=`<div class="hh" style="grid-column:${(h-9)*2+2}/span 2">${String(h).padStart(2,'0')}:00</div>`;
  WEEK.forEach((n,d)=>{const row=d+2;g+=`<div class="rd ${d===TODAY?'today':''}" style="grid-row:${row}">${WD[d]}<b>${n}</b></div>`;
    for(let i=0;i<26;i++){const t=540+i*30;if(!conflicts({d,s:hm(t),dur:30}).length)g+=`<button class="rc-f" style="grid-row:${row};grid-column:${i+2}" data-rd="${d}" data-rt="${hm(t)}" aria-label="Свободно: ${WD[d]} ${hm(t)}"></button>`}
    for(const e of events.concat(holds()).filter(e=>e.d===d&&!e.away)){const i=(m(e.s)-540)/30,lb=e.hold?'Бронь · '+e.who:label(e);
      g+=`<button class="ev ${e.hold?'hold':e.dir==='rent'?'rent-ev':'cls'}" style="--c:${DIRS[e.dir].c};grid-row:${row};grid-column:${i+2}/span ${e.dur/30}" ${e.hold?`data-hold="${e.id.slice(1)}"`:`data-ev="${e.id}"`} title="${esc(lb)}"><b>${esc(lb)}</b><span>${e.s}–${hm(m(e.s)+e.dur)}</span></button>`}});
  g+='</div>';
  if(isM()){const gd=st.gd==null?TODAY:st.gd;
    const evs=events.concat(holds()).filter(e=>e.d===gd&&!e.away).sort((a,b)=>m(a.s)-m(b.s));
    let cur=540,L='';const free=(a,b)=>{if(b-a>=30)L+=`<button class="dfree rc-f" data-rd="${gd}" data-rt="${hm(a)}" data-rdur="${Math.min(b-a,120)}"><b>Свободно ${hm(a)}–${hm(b)}</b><span>${(b-a)/60} ч · нажмите, чтобы сдать</span></button>`};
    evs.forEach(e=>{const a=m(e.s),lb=e.hold?'Бронь · '+e.who:label(e);free(cur,a);
      L+=`<button class="dev ev ${e.hold?'hold':e.dir==='rent'?'rent-ev':'cls'}" style="--c:${DIRS[e.dir].c}" ${e.hold?`data-hold="${e.id.slice(1)}"`:`data-ev="${e.id}"`}><b>${esc(lb)}</b><span>${e.s}–${hm(a+e.dur)}${e.hold?' · ждёт оплату':e.dir==='rent'?' · аренда':' · занятия студии'}</span></button>`;cur=Math.max(cur,a+e.dur)});
    free(cur,1320);
    g=`<div class="dpick" role="tablist">${WEEK.map((n,d)=>`<button class="dp ${d===gd?'on':''} ${d===TODAY?'today':''}" data-gd="${d}" role="tab"><span>${WD[d]}</span><b>${n}</b></button>`).join('')}</div><div class="dlist">${L}</div>`}
  return `<section class="stats">
    <div class="stat glass"><span class="v">${hrsR} ч</span><span class="l">аренды на этой неделе</span></div>
    <div class="stat glass"><span class="v">${rub(hrsR*price)}</span><span class="l">по аренде за неделю</span></div>
    <div class="stat glass"><span class="v">${free} ч</span><span class="l">зал свободен до воскресенья</span></div>
    <div class="stat glass"><span class="v">${hold}</span><span class="l">аренды ждут оплату</span></div></section>
  <section class="sect"><div class="sect-h"><h2>Аренда зала · 19–25 октября</h2><div class="row">${calBtn('hall')}<button class="btn pri lens" id="addRent">Сдать зал</button></div></div>
    <div class="legend"><span><i class="dot" style="background:rgba(255,255,255,.8);box-shadow:inset 0 0 0 1px var(--line)"></i>Свободно, можно сдать</span><span style="--c:var(--rose-deep)"><i class="dot"></i>Аренда</span><span><i class="dot" style="background:var(--lilac);opacity:.55"></i>Занятия студии</span><span><i class="dot" style="background:#fff;box-shadow:inset 0 0 0 1.5px var(--rose)"></i>Бронь ждёт оплату</span></div>
    <div class="gridbox">${g}</div>
    <span class="note">Свободное время можно сдать одним нажатием, а на занятое нажмите, чтобы увидеть, кто там, и перенести.</span></section>

    <div><span class="who">${esc(e.who)}</span> ${p?payPill(p):'<span class="pill wait">оплата не записана</span>'}</div>
    <div class="what"><b>${DAY_FULL[e.d]}, ${WEEK[e.d]} окт</b>, ${e.s}–${hm(m(e.s)+e.dur)} · ${e.dur/60} ч · ${rub(e.dur/60*price)}</div>${p&&owe(p)?`<div class="when">долг ${rub(owe(p))}</div>`:''}</div>

/* ---------- менеджер: оплаты ---------- */
function vPay(){
  const f=st.payF||'all',day=st.payDay,logs=PAYS.flatMap(p=>p.log);
  let list=PAYS.slice().sort((a,b)=>(pst(a)==='ok')-(pst(b)==='ok')||(pst(b)==='late')-(pst(a)==='late'));
  if(f==='debt')list=list.filter(p=>owe(p)>0);if(f==='ok')list=list.filter(p=>!owe(p));
  if(day)list=list.filter(p=>p.due===day||p.log.some(l=>l.d===day));
  const got=logs.reduce((a,l)=>a+l.sum,0),debt=PAYS.reduce((a,p)=>a+owe(p),0),late=PAYS.filter(p=>pst(p)==='late').length,dn=PAYS.filter(p=>owe(p)>0).length;
  const by=k=>logs.filter(l=>l.m===k).reduce((a,l)=>a+l.sum,0);
  let cal=`<div class="mcal">${WD.map(w=>`<span class="wd">${w}</span>`).join('')}<span style="grid-column:span 3"></span>`;
  for(let d=1;d<=31;d++){const iso='2026-10-'+String(d).padStart(2,'0'),inc=logs.filter(l=>l.d===iso).reduce((a,l)=>a+l.sum,0),due=PAYS.some(p=>p.due===iso&&owe(p)>0);
    cal+=`<button class="mc ${iso===TD?'today':''} ${iso===day?'on':''}" data-md="${iso}" aria-label="${d} октября${inc?', пришло '+rub(inc):''}${due?', есть срок оплаты':''}"><b>${d}</b>${inc?`<small>+${(inc/1000).toLocaleString('ru-RU',{maximumFractionDigits:1})}k</small>`:''}${due?'<i></i>':''}</button>`}
  cal+='</div>';
  return `<section class="stats">
    <div class="stat glass"><span class="v">${rub(got)}</span><span class="l">получено в октябре</span></div>
    <div class="stat glass"><span class="v" style="color:var(--warn)">${rub(debt)}</span><span class="l">долги, ${dn} ${plural(dn,'запись','записи','записей')}</span></div>
    <div class="stat glass"><span class="v">${late}</span><span class="l">просрочено</span></div>
    <div class="stat glass"><div class="lines" style="font-size:13px"><div><span>QR</span><b>${rub(by('qr'))}</b></div><div><span>Наличные</span><b>${rub(by('cash'))}</b></div><div><span>Перевод</span><b>${rub(by('transfer'))}</b></div></div></div></section>
  <section class="sect"><div class="sect-h"><h2>Оплаты</h2><div class="row"><button class="btn lens" id="remAll" ${dn?'':'disabled'}>Напомнить должникам</button><button class="btn pri lens" id="addPay">Записать оплату</button></div></div>
  <div class="paygrid"><div class="panel glass"><div class="sect-h" style="align-items:center"><h3 class="ph">Октябрь 2026</h3>${day?`<button class="chip lens on" id="dayClr">${dlabel(day)} ×</button>`:''}</div>${cal}
    <span class="note">Цифра в дне: сколько пришло денег. Красная точка: в этот день у кого-то срок оплаты. Нажмите на день, чтобы увидеть, кто.</span></div>
   <div style="display:grid;gap:10px;align-content:start">
    <div class="row">${[['all','Все'],['debt','Долги'],['ok','Оплачено']].map(([k,l])=>`<button class="chip lens ${f===k?'on':''}" data-pf="${k}">${l}</button>`).join('')}</div>
    ${list.length?list.map(p=>{const o=owe(p),last=p.log[p.log.length-1];return `<article class="req glass"><div style="display:grid;gap:3px;min-width:0">
      <div><span class="who">${esc(p.who)}</span> ${payPill(p)}</div><div class="what">${esc(p.what)}</div>
      <div class="when">${esc(p.contact||'без контакта')} · ${o?`оплачено ${rub(paid(p))} из ${rub(p.amount)}, долг <b style="color:var(--warn)">${rub(o)}</b>${p.due?' · срок '+dlabel(p.due):''}`:`${rub(p.amount)} · ${p.log.map(l=>METH[l.m]).filter((v,i,a)=>a.indexOf(v)===i).join(' + ')} · ${dlabel(last.d)}`}${p.rem?` · напоминаний: ${p.rem}`:''}</div></div>

        r.st==='check'?`<button class="btn pri lens" id="ok_${r.id}" data-ok="${r.id}">${r.sum?'Оплата пришла':'Подтвердить'}</button><button class="btn lens" id="no_${r.id}" data-no="${r.id}">${r.sum?'Не пришла':'Отклонить'}</button>`:
        r.st==='pay'?`<button class="btn lens" id="rem_${r.id}" data-rem="${r.id}">Напомнить</button><button class="btn ghost lens" id="no_${r.id}" data-no="${r.id}">Снять бронь</button>`:
        r.st==='wait'?`<button class="btn pri lens" id="off_${r.id}" data-off="${r.id}">Предложить место</button>`:''}</div>
    </article>`;
  const cnt=k=>requests.filter(r=>r.st===k).length;
  return `<section class="sect"><div class="sect-h"><h2>Заявки</h2><span class="note">Дублируются менеджеру в бот</span></div>
  <div class="row">${[['all','Все'],...G].filter(([k])=>k==='all'||cnt(k)).map(([k,l])=>`<button class="chip lens ${f===k?'on':''}" data-inf="${k}">${l}${k==='all'?'':' · '+cnt(k)}</button>`).join('')}</div>
  ${G.filter(([k])=>(f==='all'||f===k)&&cnt(k)).map(([k,l])=>`<div style="display:grid;gap:10px"><h3 class="ph">${l} · ${cnt(k)}</h3>${requests.filter(r=>r.st===k).map(card).join('')}</div>`).join('')||'<div class="note">Заявок нет.</div>'}</section>`}
const bindInboxBase=bind.inbox;bind.inbox=()=>{bindInboxBase();document.querySelectorAll('[data-inf]').forEach(b=>b.onclick=()=>{st.inF=b.dataset.inf;render()})};

/* ---------- подключение календарей ---------- */
DIRS.ext={name:'Из календаря',c:'#9a8fa6'};
const CALS={sasha:{on:0,acc:'',title:'Календарь тренера',sub:'Личные дела и воздушная гимнастика в другом зале. В эти часы нельзя записаться на индив.',
    imp:[{d:0,s:'14:00',dur:120,t:'heels',away:1,title:'Занят (личное)'},{d:2,s:'11:00',dur:60,t:'heels',away:1,title:'Занят (личное)'}]},
  hall:{on:0,acc:'',title:'Календарь зала',sub:'Если аренду уже записывают в Google Календарь, мы подтянем оттуда. В эти часы зал не сдаётся и не бронируется.',
    imp:[{d:5,s:'11:00',dur:120,title:'Занято (из календаря)'},{d:6,s:'10:00',dur:180,title:'Занято (из календаря)'}]}};
const feed=k=>'webcal://abdance.app/cal/'+k+'.ics';
function calSheet(k){const c=CALS[k],mine=k==='me';
  openSheet(`<span class="eyebrow">Календарь</span><h2>${mine?'Мои занятия в телефоне':c.title}</h2>
  ${mine?'':`<div class="step"><b>1. Подтянуть занятость из Google Календаря</b><span class="note">${c.sub}</span>
    ${c.on?`<div class="copy"><span style="flex:1">Подключён: ${esc(c.acc)}<br><small>обновляется сам каждые 5 минут · подтянуто ${c.imp.length} событий на этой неделе</small></span><button class="btn lens sm" id="calOff">Отключить</button></div>`
    :`<div class="fld"><label for="calAcc">Gmail, где ведётся календарь</label><input id="calAcc" type="email" placeholder="sasha@gmail.com"></div><div class="err" id="calErr"></div><button class="btn pri lens" id="calOn">Подключить Google Календарь</button>
    <span class="note">Откроется окно Google: войти и разрешить «только просмотр занятости». Названия событий и заметки мы не видим.</span>`}</div>`}
  <div class="step"><b>${mine?'':'2. '}Показывать расписание студии в телефоне</b>
    <span class="note">${mine?'Подпишитесь один раз: все ваши занятия, переносы и съёмка сами появятся и обновятся в календаре телефона.':'Подписка на расписание: все занятия, индивы и аренда сами появятся в календаре на телефоне и будут обновляться.'}</span>
    <div class="row"><a class="btn lens" href="https://calendar.google.com/calendar/r?cid=${encodeURIComponent(feed(k))}" target="_blank" rel="noopener" style="text-decoration:none">В Google Календарь</a>${mine?`<a class="btn lens" href="${feed(k)}" style="text-decoration:none">Если iPhone</a>`:''}<button class="btn lens" id="calCopy">Скопировать ссылку</button></div></div>`);
  $('calCopy').onclick=()=>{navigator.clipboard?.writeText(feed(k)).catch(()=>{});toast('Ссылка скопирована')};
  if($('calOn'))$('calOn').onclick=()=>{const a=$('calAcc').value.trim();if(!/^\S+@\S+\.\S+$/.test(a)){$('calErr').textContent='Укажите почту Google.';return}
    c.on=1;c.acc=a;c.imp.forEach(e=>events.push({...e,dir:'ext',src:k,id:++uid}));closeSheet();render();toast('Календарь подключён, занятость подтянута')};
  if($('calOff'))$('calOff').onclick=()=>{c.on=0;events=events.filter(e=>e.src!==k);closeSheet();render();toast('Календарь отключён')}}
const calBtn=k=>`<button class="btn lens" data-cal="${k}">${k!=='me'&&CALS[k].on?'Календарь подключён ✓':k==='me'?'Подписаться в календаре':'Подключить календарь'}</button>`;
['people','rentcal','my'].forEach(t=>{const b=bind[t];bind[t]=()=>{b&&b();document.querySelectorAll('[data-cal]').forEach(x=>x.onclick=()=>calSheet(x.dataset.cal))}});

try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}
const MANAGER_IDS=[7043604610,221314723];
const TGU=(window.Telegram&&Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user)||{};
if(!MANAGER_IDS.includes(TGU.id))document.querySelector('.bar .seg').style.display='none';
render();
fetch('https://dancesamui-bot.fly.dev/api/services',{headers:{Authorization:'tma '+Telegram.WebApp.initData}}).then(r=>r.ok?r.json():Promise.reject()).then(rows=>{
  const by={'Курсы':'s1','Аренда зала':'r_hall'};
  for(const r of rows){const s=SERVICES.find(x=>x.id===by[r.category]||(r.category==='Индивидуальные'&&x.cat==='Индивидуальные')||(r.category==='Детям'&&x.id==='s2'));
    if(!s)continue;if(r.price!=null)s.price=+r.price;s.pre=r.prepay_pct;s.name=r.name;s.sub=r.sub||s.sub;s.unit=r.unit||s.unit}
  applyPrices();render()}).catch(()=>{});
fetch('https://dancesamui-bot.fly.dev/api/courses',{headers:{Authorization:'tma '+Telegram.WebApp.initData}}).then(r=>r.ok?r.json():Promise.reject()).then(rows=>{
  if(!rows.length)return;
  COURSES.splice(0,COURSES.length,...rows.map(r=>fill({id:'c'+r.id.slice(0,8),dir:'heels',t:'heels',title:r.title,age:'взрослые',date:r.start_date,days:(r.days||'ВТ и ЧТ')+', 19:30–21:00',len:'2 недели, 4 занятия',price:+r.price,seats:r.seats,taken:r.taken,real:true,group:r.group_link||''})));
  COURSES.forEach(c=>{ROSTER[c.id]=[];VISITS[c.id]={}});
  window.__courseIds={};rows.forEach(r=>window.__courseIds['c'+r.id.slice(0,8)]=r.id);
  applyPrices();render();
  if(MANAGER_IDS.includes(TGU.id))LIVE_INIT()}).catch(()=>{});
function LIVE_INIT(){/* справочник клиенток: настоящие данные из базы (только менеджер) */
(()=>{const API='https://dancesamui-bot.fly.dev/api',H={Authorization:'tma '+Telegram.WebApp.initData,'Content-Type':'application/json'};
  const call=(m,p,b)=>fetch(API+p,{method:m,headers:H,body:b?JSON.stringify(b):undefined}).then(r=>r.ok?r.json():Promise.reject(r.status));
  let rows=[];const cid=id=>'c'+id.slice(0,8);
  const map=r=>({key:r.id,name:r.name,kid:r.is_child,tg:r.tg_username||'',ig:r.instagram||'',phone:r.phone||'',note:r.note||'',
    contact:[r.tg_username&&'@'+r.tg_username,r.instagram&&'ig @'+r.instagram,r.phone].filter(Boolean).join(' · '),
    extra:[r.tg_username,r.instagram,r.phone,r.note].filter(Boolean).join(' '),
    courses:(r.enrollments||[]).filter(e=>!e.waitlist).map(e=>cid(e.course_id)),visits:0,pays:[],indiv:0,rent:0,last:null});
  const load=()=>call('GET','/clients').then(x=>{rows=x.map(map)});
  const fields=o=>`<div class="fld"><label for="lN">Имя</label><input id="lN" value="${esc(o.name||'')}"></div>
    <div class="fld"><label for="lT">Ник в Телеграме</label><input id="lT" placeholder="@username" value="${esc(o.tg?'@'+o.tg:'')}"></div>
    <div class="fld"><label for="lI">Инстаграм</label><input id="lI" placeholder="@instagram" value="${esc(o.ig?'@'+o.ig:'')}"></div>
    <div class="fld"><label for="lP">Телефон</label><input id="lP" inputmode="tel" placeholder="+66 …" value="${esc(o.phone||'')}"></div>
    <div class="fld"><label for="lK">Заметка</label><textarea id="lK" rows="3" placeholder="Что важно помнить">${esc(o.note||'')}</textarea></div>`;
  const val=()=>({name:$('lN').value,tg_username:$('lT').value,instagram:$('lI').value,phone:$('lP').value,note:$('lK').value});
  const picker=sel=>`<div style="display:grid;gap:6px"><b>Был на курсах</b>${COURSES.map(c=>`<label class="copy" style="cursor:pointer"><input type="checkbox" data-lc="${c.id}" ${sel.includes(c.id)?'checked':''}> <span style="flex:1">${esc(c.title)}</span></label>`).join('')||'<div class="note">Потоков пока нет.</div>'}</div>`;
  window.__courseIds=window.__courseIds||{};
  LIVE={ids:window.__courseIds,load,
    list:()=>rows.slice(),
    sheet(k){const o=rows.find(x=>x.key===k);if(!o)return;
      openSheet(`<span class="eyebrow">${o.kid?'Ребёнок · пишем родителю':'Клиентка'}</span><h2>${esc(o.name)}</h2>
        ${o.tg?`<a class="btn pri lens" href="https://t.me/${encodeURIComponent(o.tg)}" target="_blank" rel="noopener" style="text-decoration:none">Написать в Телеграм</a>`:''}
        ${fields(o)}${picker(o.courses)}<button class="btn pri lens" id="lSave">Сохранить</button>`);
      document.querySelectorAll('[data-lc]').forEach(b=>b.onchange=()=>{call('POST','/enroll',{client_id:o.key,course_id:LIVE.ids[b.dataset.lc],on:b.checked}).then(()=>{b.checked?o.courses.push(b.dataset.lc):o.courses.splice(o.courses.indexOf(b.dataset.lc),1);toast(b.checked?'Добавлена в курс':'Убрана из курса')}).catch(()=>{b.checked=!b.checked;toast('Не получилось, попробуйте ещё раз')})});
      $('lSave').onclick=()=>{if(!$('lN').value.trim()){toast('Нужно имя');return}call('PATCH','/clients/'+o.key,val()).then(load).then(()=>{closeSheet();render();toast('Сохранено')}).catch(()=>toast('Не получилось сохранить'))}},
    add(){openSheet(`<span class="eyebrow">Справочник</span><h2>Новая клиентка</h2>${fields({})}
        <label class="copy" style="cursor:pointer"><input type="checkbox" id="lKid"> <span>Ребёнок (контакт родителя)</span></label>${picker([])}
        <button class="btn pri lens" id="lAdd">Добавить</button>`);
      $('lAdd').onclick=()=>{if(!$('lN').value.trim()){toast('Нужно имя');return}
        const ids=[...document.querySelectorAll('[data-lc]:checked')].map(b=>LIVE.ids[b.dataset.lc]).filter(Boolean);
        call('POST','/clients',{...val(),is_child:$('lKid').checked,course_ids:ids}).then(load).then(()=>{closeSheet();render();toast('Добавлена в справочник')}).catch(()=>toast('Не получилось добавить'))}}};
})();

LIVE.load().then(()=>render()).catch(()=>{})}
</script>
